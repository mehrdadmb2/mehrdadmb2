name: Featured Movie Posters

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: profile-generated-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh personal movie poster shelf
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Generate poster previews from IMDb Showcase
        run: python scripts/generate_live_profile.py --movies-only

      - name: Validate generated README and poster references
        run: python scripts/check_profile.py

      - name: Commit changed README and poster assets
        run: |
          set -euo pipefail
          git add README.md
          if [ -d assets/posters ]; then git add assets/posters; fi
          if git diff --cached --quiet; then
            echo "No movie shelf changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh featured movie posters"
          git push

# Generate the profile's own dual-theme contribution snake from GitHub GraphQL.
name: Contribution Snake

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC, after Profile Metrics
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/generate_snake.py"
      - ".github/workflows/snake.yml"

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generate snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USER: mehrdadmb2
        run: python scripts/generate_snake.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo "No change in contribution data — nothing to commit."
          else
            git commit -m "chore: refresh contribution snake [skip ci]"
            git push
          fi

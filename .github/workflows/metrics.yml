# Updates each metrics SVG independently so one upstream/API hiccup won't block
# the remaining profile panels. See SETUP.md for the METRICS_TOKEN requirement.
name: Profile Metrics

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📊 Core dashboard
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Tehran
          plugin_languages: yes
          plugin_languages_limit: 8

      - name: 🧮 Isometric contribution terrain
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          config_timezone: Asia/Tehran
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 🈷️ Language fingerprint
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_languages: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 10

      - name: 🏆 Achievement matrix
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C

      - name: 🧠 Coding habits
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          config_timezone: Asia/Tehran
          plugin_habits: yes

      - name: 🎩 Notable contributions
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes

      - name: 📰 Recent activity
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_activity: yes

      - name: 📚 Repository landscape
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_repositories: yes

      - name: 📆 Full contribution history
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      - name: 🧬 Lines changed over time
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehrdadmb2
          base: ""
          plugin_lines: yes
          plugin_lines_delay: yes

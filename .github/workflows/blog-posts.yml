# Refresh the recent-activity section from the profile owner's public Atom feed.
name: Blog Posts

on:
  schedule:
    - cron: "0 5 * * *" # daily at 05:00 UTC
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/blog-posts.yml"

concurrency:
  group: profile-activity-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest entries into README.md
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1.9.7
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://github.com/mehrdadmb2.atom"
          max_post_count: 6
          readme_path: "./README.md"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          retry_count: 2
          retry_wait_time: 3
          enable_keepalive: false

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="385" viewBox="0 0 1040 385" role="img" aria-label="Mehrdad verified GitHub milestones">
<title>Mehrdad verified GitHub milestones</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09070f"/><stop offset="1" stop-color="#160b22"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b44fe8"/><stop offset="1" stop-color="#e0aaff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1038" height="383" rx="23" fill="none" stroke="#4b2a58"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="46" fill="url(#accent)" font-size="25" font-weight="800">ACHIEVEMENTS // VERIFIED MILESTONES</text>
<text x="42" y="69" fill="#bca9ca" font-size="12">Repository-local profile milestones • generated without a third-party trophy renderer</text>

<g transform="translate(42,92)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">44</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">REPOSITORIES</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">owned repositories</text>
</g>

<g transform="translate(352,92)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">16K</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">COMMITS</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">16,087 recorded</text>
</g>

<g transform="translate(662,92)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">8</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">PULL REQUESTS</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">contribution records</text>
</g>

<g transform="translate(42,182)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">★</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">OPEN SOURCE</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">public GitHub profile</text>
</g>

<g transform="translate(352,182)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">∞</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">BUILD LOOP</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">learn → build → improve</text>
</g>

<g transform="translate(662,182)">
<rect width="280" height="72" rx="16" fill="#120c19" stroke="#33203d"/>
<circle cx="34" cy="36" r="22" fill="#24122f" stroke="#7a2fa3"/>
<text x="34" y="41" fill="#e0aaff" font-size="12" font-weight="800" text-anchor="middle">✓</text>
<text x="68" y="29" fill="#f5efff" font-size="11" font-weight="800">LOCAL PIPELINE</text>
<text x="68" y="49" fill="#bca9ca" font-size="10">visuals generated in-repo</text>
</g>

<rect x="42" y="286" width="900" height="54" rx="14" fill="#0f0915" stroke="#2d1c35"/>
<text x="62" y="309" fill="#e0aaff" font-size="11" font-weight="800">OFFICIAL GITHUB ACHIEVEMENTS</text>
<text x="62" y="328" fill="#bca9ca" font-size="10">The README button opens GitHub's own achievement view. Local milestones never masquerade as official GitHub badges.</text>
</g>
</svg>

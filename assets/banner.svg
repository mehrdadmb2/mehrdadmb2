<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Mehrdad MB2 — Software, IoT, automation and visual engineering</title>
  <desc id="desc">A premium dark technology banner with a glowing MB2 monogram, connected nodes, market-data lines, sensor signals and geometric 3D forms.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset=".48" stop-color="#10182B"/><stop offset="1" stop-color="#080E1D"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32E6D0"/><stop offset=".48" stop-color="#7489FF"/><stop offset="1" stop-color="#FF9A53"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20314D" stop-opacity=".84"/><stop offset="1" stop-color="#0B1427" stop-opacity=".58"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#19CDBD" stop-opacity=".24"/><stop offset="1" stop-color="#19CDBD" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#6D63FF" stop-opacity=".23"/><stop offset="1" stop-color="#6D63FF" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7F9BB8" stroke-opacity=".09" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#base)"/>
  <rect width="1600" height="520" rx="34" fill="url(#grid)"/>
  <ellipse cx="1220" cy="240" rx="500" ry="390" fill="url(#aura)"/>
  <ellipse cx="1420" cy="100" rx="400" ry="300" fill="url(#violet)"/>
  <path d="M0 1H1600" stroke="url(#beam)" stroke-width="3" opacity=".9"/>
  <g opacity=".35" fill="none" stroke="#5F83A6" stroke-width="1.5">
    <path d="M850 66H1080L1140 126H1514"/><path d="M920 448H1140L1216 372H1536"/><path d="M1064 0V74L1112 122V218"/>
    <path d="M1370 0V66L1317 119V188"/><path d="M1280 520V452L1345 387H1600"/>
  </g>
  <g fill="#42E6D0"><circle cx="1080" cy="66" r="4"/><circle cx="1514" cy="126" r="4"/><circle cx="1140" cy="448" r="4"/></g>
  <g transform="translate(86 88)">
    <rect width="120" height="120" rx="32" fill="url(#glass)" stroke="url(#beam)" stroke-width="2.2"/>
    <path d="M25 34V89M25 34L46 65L67 34V89" fill="none" stroke="#42E6D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 46C78 36 87 30 98 30C111 30 118 37 118 47C118 55 112 62 103 68L80 84H119" transform="translate(-1 0)" fill="none" stroke="#FF9A53" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="108" r="3" fill="#42E6D0"/><circle cx="37" cy="108" r="3" fill="#7C8CFF"/><circle cx="50" cy="108" r="3" fill="#FF9A53"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="86" y="284" fill="#F7FAFF" font-size="83" font-weight="800" letter-spacing="-3">MEHRDAD <tspan fill="#43E4D0">MB2</tspan></text>
    <text x="90" y="338" fill="#B7C7DE" font-size="26" letter-spacing="4" font-weight="600">SOFTWARE ENGINEERING  /  IOT  /  AUTOMATION</text>
    <text x="90" y="391" fill="#7E92AD" font-size="20">Building useful systems across code, hardware, data and visual design.</text>
  </g>
  <g transform="translate(1025 90)">
    <rect width="480" height="320" rx="26" fill="url(#glass)" stroke="#7693B6" stroke-opacity=".36"/>
    <path d="M24 1H456" stroke="url(#beam)" stroke-width="2.5"/>
    <g font-family="Consolas,monospace">
      <text x="28" y="46" fill="#8CA4C1" font-size="14">SYSTEM / MULTI-DOMAIN BUILD</text>
      <circle cx="30" cy="82" r="5" fill="#42E6D0"/><text x="48" y="88" fill="#E4F6F5" font-size="18">software &amp; APIs</text>
      <circle cx="30" cy="126" r="5" fill="#7C8CFF"/><text x="48" y="132" fill="#E4E8FF" font-size="18">ESP32 / embedded telemetry</text>
      <circle cx="30" cy="170" r="5" fill="#FF9A53"/><text x="48" y="176" fill="#FFE8D5" font-size="18">market data &amp; automation</text>
      <circle cx="30" cy="214" r="5" fill="#8CE9A8"/><text x="48" y="220" fill="#E2FBEA" font-size="18">3D design &amp; visualization</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B44FE8"/>
      <stop offset="100%" stop-color="#E0AAFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه -->
  <!-- پس‌زمینه -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- مدار تزئینی -->
  <path d="M20 180 L80 140 L140 160 L200 120 L260 130 L320 90" stroke="#B44FE8" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="20" cy="180" r="3" fill="#B44FE8" opacity="0.3"/>
  <circle cx="320" cy="90" r="3" fill="#B44FE8" opacity="0.3"/>

  <!-- متن اصلی -->
  <text x="400" y="90" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="52" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)">MEHRDAD</text>

  <!-- زیرنویس -->
  <text x="400" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#E0AAFF" opacity="0.8">Software Developer | IoT Builder | Embedded Systems Enthusiast</text>

  <!-- خط جداکننده -->
  <line x1="200" y1="150" x2="600" y2="150" stroke="#B44FE8" stroke-width="1" opacity="0.4"/>
</svg>

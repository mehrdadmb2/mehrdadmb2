<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Mehrdad — Software, IoT, Embedded and 3D</title>
  <desc id="desc">Futuristic developer profile banner with a holographic grid, network lines and terminal-style identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070D"/>
      <stop offset="0.45" stop-color="#111025"/>
      <stop offset="1" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B28CFF" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="430" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="394" rx="22" fill="url(#grid)"/>
  <ellipse cx="1280" cy="240" rx="260" ry="190" fill="url(#orb)" filter="url(#soft)"/>

  <g opacity="0.65" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
    <path d="M75 332 C220 210, 300 390, 430 268 S690 95, 820 234"/>
    <path d="M980 105 C1100 185, 1170 62, 1305 168 S1488 300, 1545 130"/>
    <path d="M1120 358 C1200 308, 1280 408, 1450 320" opacity="0.5"/>
  </g>

  <g fill="#C084FC" filter="url(#glow)">
    <circle cx="75" cy="332" r="5"/>
    <circle cx="430" cy="268" r="5"/>
    <circle cx="820" cy="234" r="5"/>
    <circle cx="980" cy="105" r="5"/>
    <circle cx="1305" cy="168" r="5"/>
    <circle cx="1545" cy="130" r="5"/>
  </g>

  <g transform="translate(1180 74)" opacity="0.78" fill="none" stroke="#67E8F9">
    <circle cx="120" cy="120" r="86"/>
    <circle cx="120" cy="120" r="112" opacity="0.3"/>
    <path d="M8 120h224M120 8v224"/>
    <path d="M55 55l130 130M185 55L55 185" opacity="0.35"/>
  </g>

  <g transform="translate(92 78)">
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#0C0B15" stroke="#7C3AED" stroke-opacity="0.55"/>
    <circle cx="20" cy="21" r="5" fill="#34D399"/>
    <text x="35" y="26" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="15">system://mehrdad</text>
  </g>

  <text x="800" y="165" text-anchor="middle" fill="url(#neon)" font-family="Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="10">MEHRDAD</text>
  <text x="800" y="215" text-anchor="middle" fill="#F5F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="24" letter-spacing="2">SOFTWARE • IoT • EMBEDDED • 3D</text>
  <text x="800" y="258" text-anchor="middle" fill="#A78BFA" font-family="JetBrains Mono,Consolas,monospace" font-size="17">turning ideas into practical systems</text>

  <g font-family="JetBrains Mono,Consolas,monospace" fill="#94A3B8" font-size="13">
    <text x="110" y="372">$ whoami → mehrdadmb2</text>
    <text x="610" y="372">$ build --reliable --useful</text>
    <text x="1170" y="372">$ status → online</text>
  </g>

  <rect x="550" y="300" width="500" height="2" rx="1" fill="url(#neon)" opacity="0.8"/>
</svg>

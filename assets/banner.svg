      <path d="M0 43H424" stroke="#8AA4C4" stroke-opacity=".23"/>
    </g>
  </g>
  <g fill="#C9D7E8" opacity=".8" filter="url(#glow)"><circle cx="958" cy="110" r="2.5"/><circle cx="1516" cy="438" r="3"/><circle cx="868" cy="365" r="2.2"/><circle cx="1450" cy="52" r="2.2"/></g>
  <text x="88" y="474" fill="#627892" font-family="Consolas,monospace" font-size="13" letter-spacing="2">SHIRAZ, IRAN  ·  LEARN / BUILD / MEASURE / IMPROVE</text>
  <text x="1505" y="474" text-anchor="end" fill="#627892" font-family="Consolas,monospace" font-size="13" letter-spacing="2">GITHUB.COM/MEHRDADMB2</text>

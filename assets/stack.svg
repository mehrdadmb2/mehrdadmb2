    <g transform="translate(550 26)"><rect width="500" height="132" rx="18" fill="url(#card)" stroke="#67E8F9" stroke-opacity=".4"/><rect x="20" y="21" width="4" height="29" rx="2" fill="#67E8F9"/><text x="38" y="42" fill="#CFFAFE" font-size="21" font-weight="700">EMBEDDED &amp; IoT</text><text x="24" y="78" fill="#E2E8F0" font-size="17">ESP32 · Arduino · Raspberry Pi</text><text x="24" y="105" fill="#94A3B8" font-size="16">DHT22 · OLED · RFID · SPI · I²C</text></g>
    <g transform="translate(1074 26)"><rect width="500" height="132" rx="18" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".42"/><rect x="20" y="21" width="4" height="29" rx="2" fill="#A78BFA"/><text x="38" y="42" fill="#EDE9FE" font-size="21" font-weight="700">BACKEND &amp; DATA</text><text x="24" y="78" fill="#E2E8F0" font-size="17">.NET · Node.js · REST APIs</text><text x="24" y="105" fill="#94A3B8" font-size="16">SQLite · MySQL · SQL Server</text></g>
    <g transform="translate(26 178)"><rect width="500" height="146" rx="18" fill="url(#card)" stroke="#67E8F9" stroke-opacity=".4"/><rect x="20" y="21" width="4" height="29" rx="2" fill="#67E8F9"/><text x="38" y="42" fill="#CFFAFE" font-size="21" font-weight="700">DEVOPS &amp; SYSTEMS</text><text x="24" y="82" fill="#E2E8F0" font-size="17">Git · GitHub · Docker · Linux · Bash</text><text x="24" y="110" fill="#94A3B8" font-size="16">Nginx · VS Code · Visual Studio</text><text x="24" y="132" fill="#64748B" font-size="12">TROUBLESHOOTING / OBSERVABILITY</text></g>
    <g transform="translate(550 178)"><rect width="500" height="146" rx="18" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".42"/><rect x="20" y="21" width="4" height="29" rx="2" fill="#A78BFA"/><text x="38" y="42" fill="#EDE9FE" font-size="21" font-weight="700">3D &amp; ENGINEERING</text><text x="24" y="82" fill="#E2E8F0" font-size="17">Blender · Cinema 4D · SolidWorks</text><text x="24" y="110" fill="#94A3B8" font-size="16">Modeling · rendering · visual effects</text><text x="24" y="132" fill="#64748B" font-size="12">DESIGN / VISUALIZATION / PROTOTYPING</text></g>
    <g transform="translate(1074 178)"><rect width="500" height="146" rx="18" fill="url(#card)" stroke="#67E8F9" stroke-opacity=".38"/><rect x="20" y="21" width="4" height="29" rx="2" fill="#67E8F9"/><text x="38" y="42" fill="#CFFAFE" font-size="21" font-weight="700">ENGINEERING VALUES</text><text x="24" y="82" fill="#E2E8F0" font-size="17">Reliability · portability · clarity</text><text x="24" y="110" fill="#94A3B8" font-size="16">Offline resilience · useful automation</text><text x="24" y="132" fill="#64748B" font-size="12">BUILD FOR REAL-WORLD CONSTRAINTS</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 350" role="img" aria-labelledby="title desc">
  <title id="title">Mehrdad's engineering toolkit</title>
  <desc id="desc">Six glass-style technology cards covering programming languages, embedded IoT, backend data, DevOps systems, 3D design and engineering values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B17"/><stop offset="1" stop-color="#11172B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202342" stop-opacity=".68"/><stop offset="1" stop-color="#0C1325" stop-opacity=".82"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="350" rx="26" fill="url(#bg)" stroke="#64748B" stroke-opacity=".35"/>

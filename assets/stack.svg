  <g fill="#67E8F9" filter="url(#glow)"><circle cx="526" cy="92" r="3"/><circle cx="1050" cy="92" r="3"/><circle cx="526" cy="250" r="3"/><circle cx="1050" cy="250" r="3"/></g>

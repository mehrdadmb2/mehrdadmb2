<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">MB2 monogram</title><desc id="desc">A geometric MB2 developer monogram with cyan, mint and orange light.</desc>
